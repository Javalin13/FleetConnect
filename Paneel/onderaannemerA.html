<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>FleetConnect - Operator Paneel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; height: 100vh; display: flex; }
        
        .sidebar {
            width: 280px;
            background: #0f172a;
            color: #e2e8f0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s ease;
        }
        .sidebar.collapsed { width: 80px; }
        .sidebar.collapsed .logo .logo-text,
        .sidebar.collapsed .logo small,
        .sidebar.collapsed .nav-item span,
        .sidebar.collapsed .nav-section-title { display: none; }
        .sidebar.collapsed .nav-item { justify-content: center; }
        .sidebar.collapsed .nav-item i { margin: 0; }
        
        .logo {
            padding: 24px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            border-bottom: 1px solid #1e293b;
            background: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .logo i.fa-bars { color: #e2e8f0; font-size: 1.3rem; }
        .logo .logo-text { flex: 1; }
        .logo i.fa-taxi { color: #2dd4bf; margin-right: 8px; }
        .logo small { font-size: 0.7rem; display: block; color: #64748b; margin-top: 4px; }
        
        .nav-menu { padding: 20px 16px; flex: 1; }
        .nav-section { margin-bottom: 20px; }
        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; padding: 8px 12px; white-space: nowrap; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nav-item:hover { background: #1e293b; }
        .nav-item.active { background: #2dd4bf20; color: #2dd4bf; }
        .nav-item.active i { color: #2dd4bf; }
        .nav-item.active span { color: #2dd4bf; }
        .nav-item i { width: 22px; }
        .nav-item.logout-item { margin-top: 16px; border-top: 1px solid #1e293b; border-radius: 0; padding-top: 16px; color: #f87171; }
        .nav-item.switch-item { border-top: 1px solid #1e293b; margin-top: 8px; padding-top: 16px; color: #f59e0b; }
        .nav-item.switch-item:hover { background: #f59e0b20; color: #f59e0b; }
        
        .language-selector {
            display: flex;
            gap: 5px;
            background: #1e293b;
            padding: 5px 10px;
            border-radius: 40px;
            margin-left: 10px;
        }
        .lang-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .lang-btn:hover { background: #334155; color: white; }
        .lang-btn.active { background: #2dd4bf; color: #0f172a; }
        
        /* Route kolom styling - eenvoudige browser tooltip */
        .route-cell {
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: help;
            border-bottom: 1px dotted #cbd5e1;
        }
        .route-cell:hover {
            background-color: #f1f5f9;
        }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow: auto; }
        .header {
            background: white;
            padding: 20px 32px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 { font-size: 1.5rem; font-weight: 600; }
        .header-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .refresh-btn, .back-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }
        .refresh-btn { background: #2dd4bf; color: #0f172a; }
        .refresh-btn:hover { background: #14b8a6; }
        .back-btn { background: #e2e8f0; color: #0f172a; }
        .back-btn:hover { background: #cbd5e1; }
        .content { padding: 32px; }
        
        .filter-bar { background: white; padding: 8px 16px; border-radius: 48px; margin-bottom: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 1px solid #e2e8f0; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 0.65rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; padding-left: 16px; }
        .filter-group input, .filter-group select { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 24px; font-size: 0.85rem; outline: none; background: #f8fafc; min-width: 200px; }
        .filter-group input:focus, .filter-group select:focus { border-color: var(--primary); background: white; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }
        .mailbox-nav-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: 0.15s; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #475569; }
        .mailbox-nav-item:hover { background: #f1f5f9; }
        .mailbox-nav-item.active { background: var(--primary); color: white; font-weight: 600; }
        .mailbox-nav-item.active i { color: var(--accent-gold); }
        .order-count { background: var(--primary); color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; }
        .filter-group { display: flex; align-items: center; gap: 6px; background: #f8fafc; padding: 4px 12px; border-radius: 32px; border: 1px solid #e2e8f0; }
        .filter-group label { font-size: 0.7rem; font-weight: 600; color: #475569; }
        .filter-group input { border: none; background: transparent; padding: 6px 0; font-family: 'Inter', sans-serif; font-size: 0.8rem; width: 120px; outline: none; }
        .filter-actions { display: flex; gap: 6px; margin-left: auto; }
        .filter-actions button { padding: 6px 14px; border-radius: 32px; border: none; cursor: pointer; font-weight: 500; font-size: 0.75rem; }
        .btn-filter { background: #0f172a; color: white; }
        .btn-reset { background: #e2e8f0; color: #1e293b; }
        
        .orders-table-wrapper { overflow-x: auto; background: white; border-radius: 16px; padding: 20px; }
        .orders-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .orders-table th { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: 600; color: #64748b; }
        .orders-table td { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; font-size: 0.8rem; }
        
        .action-btn { background: #2dd4bf; color: #0f172a; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.75rem; }
        .approve-btn { background: #10b981 !important; color: #ffffff !important; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; }
        .delete-btn { background: #ef4444; color: white; margin-left: 8px; padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.7rem; }
        .account-request-actions { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
        .add-btn { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.8rem; margin-bottom: 16px; }
        .order-count { background: #2dd4bf20; padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; color: #0f172a; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 20px; max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .fiche-header { background: #0f172a; color: white; padding: 20px; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
        .fiche-header h3 { font-size: 1.2rem; }
        .close-modal { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); color: white; font-size: 1.5rem; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; line-height: 1; flex: 0 0 auto; }
        .close-modal:hover { background: rgba(255,255,255,0.24); }
        .fiche-body { padding: 24px; }
        .fiche-section { margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .fiche-section h4 { color: #2dd4bf; margin-bottom: 12px; font-size: 0.9rem; }
        .fiche-row { display: flex; padding: 6px 0; font-size: 0.85rem; }
        .fiche-label { width: 130px; font-weight: 600; color: #475569; }
        .fiche-value { flex: 1; color: #1e293b; word-break: break-word; }
        .fiche-total { background: #f0fdf4; padding: 12px; border-radius: 12px; margin-top: 16px; text-align: center; }
        .fiche-total .amount { font-size: 1.5rem; font-weight: 700; color: #2dd4bf; }
        .fiche-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0; }
        .fiche-btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 500; }
        .fiche-btn.confirm { background: #10b981; color: white; }
        .fiche-btn.close { background: #64748b; color: white; }
        .fiche-btn.assign { background: #f59e0b; color: white; }
        
        .people-card { background: white; border-radius: 16px; padding: 20px; }
        
        
        .empty-planning { text-align: center; padding: 40px; color: #94a3b8; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: white; border-radius: 16px; padding: 20px; text-align: center; }
        .kpi-card .value { font-size: 1.8rem; font-weight: 700; }
        .kpi-card .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-top: 8px; }
        
        
        .partner-card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 16px; background: #f8fafc; }
        .partner-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .partner-name { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 12px 24px; border-radius: 40px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .hidden { display: none; }
        .compact-checkbox { width: 18px !important; min-width: 18px !important; height: 18px !important; margin: 0 !important; cursor: pointer; -webkit-appearance: checkbox !important; appearance: checkbox !important; flex: none !important; }
        
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-accepted { background: #dbeafe; color: #1e40af; }
        .status-assigned { background: #e0f2fe; color: #0369a1; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }

        @media (max-width: 1200px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .route-cell { max-width: 200px; }
        }
        @media (max-width: 768px) {
            .sidebar:not(.collapsed) { width: 280px; }
            .sidebar.collapsed { width: 80px; }
            .content { padding: 16px; }
            .account-request-actions { width: 100%; justify-content: stretch; }
            .account-request-actions .approve-btn,
            .account-request-actions .delete-btn,
            .account-request-actions .action-btn { flex: 1 1 100%; margin-left: 0; min-height: 44px; }
            .header { padding: 16px; }
            .route-cell { max-width: 150px; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 1rem; }
            .route-cell { max-width: 120px; }
        }
    </style>
</head>
<body>
    <div class="sidebar collapsed" id="sidebar">
        <div class="logo" onclick="if(window.app) app.toggleSidebar()">
            <i class="fas fa-bars"></i>
            <div class="logo-text">
                <i class="fas fa-taxi"></i> FleetConnect
                <br><small id="sidebarSubtitle">Operator Paneel</small>
            </div>
        </div>
        <div class="nav-menu">
            <div class="nav-section">
                <div class="nav-section-title" id="navBookings">BOEKINGEN</div>
                <div class="nav-item active" data-tab="neworders"><i class="fas fa-clipboard-list"></i><span id="navNewOrders">New Orders</span></div>
                <div class="nav-item" data-tab="orders"><i class="fas fa-box"></i><span id="navOrders">Active Orders</span></div>
                <div class="nav-item" data-tab="history"><i class="fas fa-history"></i><span id="navHistory">History</span></div>
            </div>
            <div class="nav-section">
                <div class="nav-section-title" id="navManagement">BEHEER</div>
                <div class="nav-item" data-tab="drivers"><i class="fas fa-id-card"></i><span id="navDrivers">Drivers</span></div>
                <div class="nav-item" data-tab="customers"><i class="fas fa-handshake"></i><span id="navCustomers">Clients/Partners</span></div>
            </div>

                <div class="nav-section-title" id="navFinance">FINANCIËN</div>

    <div class="main">

        <div class="header">
            <h1 id="pageTitle">New Orders</h1>

            <div class="fiche-body" id="ficheBody"></div>

    <div id="partnerModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="fiche-header"><h3 id="partnerModalTitle"><i class="fas fa-handshake"></i> Partner Beheer</h3><button class="close-modal" id="closePartnerModalBtn">&times;</button></div>
            <div class="fiche-body">

    <div id="toast" class="toast"></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        // comms (CommunicationService) is optional — wrap import in try/catch so the dashboard
        // still works even if the communication module fails to load
        let comms = null;
        try {
            const mod = await import('../src/modules/communication/index.js');
            const CS = mod.CommunicationService || mod.default;
            if (CS) comms = new CS();
            else comms = mod.comms || null;
            // Wrap comms methods so calls never throw ReferenceError
            if (comms && !comms.__fcSafeWrapped) {
                const safeCall = (name) => async (...args) => {
                    try { if (typeof comms[name] === 'function') return await comms[name](...args); }
                    catch (e) { console.warn(`[dashboard] comms.${name} failed:`, e?.message || e); }
                    return { success: false, error: 'comms unavailable' };
                };
                comms.trigger = safeCall('trigger');
                comms.sendAccountDecisionEmail = safeCall('sendAccountDecisionEmail');
                comms.activeProvider = comms.activeProvider || { send: safeCall('send') };
                comms.__fcSafeWrapped = true;
            }
        } catch (commsErr) {
            console.warn('[dashboard] comms module unavailable, emails disabled:', commsErr?.message || commsErr);
            comms = {
                trigger: async () => ({ success: false, error: 'comms unavailable' }),
                sendAccountDecisionEmail: async () => ({ success: false, error: 'comms unavailable' }),
                activeProvider: { send: async () => ({ success: false, error: 'comms unavailable' }) }
            };
        }

        (async function checkAuthentication() {
                    // r055 hardening (per Lux r054 §4): sessionStorage is convenience ONLY.
                    // The server-derived authorize_admin_role() RPC is the source of truth.
                    // On every protected page load, we:
                    //   1. Verify a valid Supabase session exists
                    //   2. Call authorize_admin_role() with NO args (identity from auth.uid())
                    //   3. Confirm operator_scope OR founder_scope
                    //   4. Sign out + redirect if any check fails
                    // Tampering with sessionStorage alone CANNOT grant access.

                    // First: must have a Supabase session
                    let sessionOk = false;
                    try {
                        const { data, error } = await supabase.auth.getSession();
                        if (error) throw error;
                        sessionOk = ! !data?.session?.user;
                    } catch (e) {
                        console.error('getSession failed:', e);
                    }
                    if (!sessionOk) {
                        sessionStorage.clear();
                        window.location.replace('admin-index.html');
                        return;
                    }

                    // Second: call authorize_admin_role() v2 (NO args; identity from auth.uid())
                    let authz;
                    try {
                        const rpcRes = await supabase.rpc('authorize_admin_role');
                        if (rpcRes.error) throw rpcRes.error;
                        authz = rpcRes.data;
                    } catch (e) {
                        console.error('authorize_admin_role RPC failed:', e);
                        await supabase.auth.signOut();
                        sessionStorage.clear();
                        window.location.replace('admin-index.html');
                        return;
                    }

                    // Third: must have operator or founder scope from server
                    if (!authz || !(authz.operator_scope || authz.founder_scope)) {
                        console.warn('Authorization denied on protected page load:', authz?.reason);
                        await supabase.auth.signOut();
                        sessionStorage.clear();
                        window.location.replace('admin-index.html');
                        return;
                    }

                    // Fourth (convenience): refresh sessionStorage flags from server result
                    sessionStorage.setItem('horizon_logged_in', 'true');
                    sessionStorage.setItem('horizon_founder_scope', authz.founder_scope ? 'true' : 'false');
                    sessionStorage.setItem('horizon_operator_scope', authz.operator_scope ? 'true' : 'false');
                    sessionStorage.setItem('horizon_role', authz.role || '');
                    if (authz.partner_scope && authz.partner_scope.partner_id) {
                        sessionStorage.setItem('horizon_partner_id', String(authz.partner_scope.partner_id));
                        sessionStorage.setItem('horizon_partner_name', authz.partner_scope.partner_name || '');
                        sessionStorage.setItem('horizon_partner_is_hoofd', authz.partner_scope.is_hoofd ? 'true' : 'false');
                    } else {
                        sessionStorage.removeItem('horizon_partner_id');
                        sessionStorage.removeItem('horizon_partner_name');
                        sessionStorage.removeItem('horizon_partner_is_hoofd');
                    }
                })();

        const SUPABASE_URL = 'https://rreqjjrmvytnwnsidmqi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZXFqanJtdnl0bnduc2lkbXFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjAxMzcsImV4cCI6MjA5Mzk5NjEzN30.q4M3A6Dix3F_9Im2pw8DUIeE4C-INtUlvImRDM58MTA';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const translations = {
            nl: {
                sidebarSubtitle: "Operator Paneel", navBookings: "BOEKINGEN", navNewOrders: "New Orders", navOrders: "Active Orders", navHistory: "History",

            filterAndSortData() {

                // ALL lifecycle buckets are STATUS-DRIVEN, not CLOCK-DRIVEN.

            shortenRoute(pickup, destination) {
                const shortenAddress = (address) => {
                    if (!address) return '';
                    const parts = address.split(',').map(p => p.trim());
                    if (parts.length <= 2) return address;
                    let result = parts[0];
                    if (parts.length >= 2 && parts[1].length < 50) result += ', ' + parts[1];
                    else if (parts.length >= 3 && parts[2].length < 50) result += ', ' + parts[2];
                    if (result.length > 55) result = result.substring(0, 52) + '...';
                    return result;
                };
                return `${shortenAddress(pickup)} -> ${shortenAddress(destination)}`;
            },
            getFullRoute(pickup, destination) { return `${pickup || ''} -> ${destination || ''}`; },
            sortBookings(list, sortValue) {
                const items = [...(list || [])];
                const dt = (b) => this.parseDate(b.datetime || '01-01-1970', b.time || '00:00');
                return items.sort((a, b) => {
                    if (sortValue === 'date_desc') return dt(b) - dt(a);
                    if (sortValue === 'customer') return (a.name || '').localeCompare(b.name || '');
                    if (sortValue === 'amount_desc') return (b.amount || 0) - (a.amount || 0);
                    if (sortValue === 'status') return (a.status || '').localeCompare(b.status || '');
                    return dt(a) - dt(b);
                });

                <div id="partnersList" style="margin-top:16px;">`;
                if (!active.length) html += `<div class="empty-planning">${t.noPartners}</div>`;

                    html += `<details style="margin-top:20px;"><summary style="cursor:pointer; font-weight:700;">Gearchiveerde partners (${archived.length})</summary><div style="margin-top:12px;">${archived.map(renderPartner).join('')}</div></details>`;

            applyFiltersPartners() {
                const q = (document.getElementById('filterPartners')?.value || '').toLowerCase();
                const sort = document.getElementById('sortPartners')?.value || 'name';
                let filtered = this.partners.filter(p => !q ||
                    (p.name || '').toLowerCase().includes(q) ||
                    (p.contact || '').toLowerCase().includes(q) ||
                    (p.email || '').toLowerCase().includes(q) ||
                    (p.prefix || '').toLowerCase().includes(q)
                );
                filtered.sort((a, b) => {
                    if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
                    if (sort === 'name_desc') return (b.name || '').localeCompare(a.name || '');
                    if (sort === 'hoofd') return (b.is_hoofd ? 1 : 0) - (a.is_hoofd ? 1 : 0);
                    if (sort === 'email') return (a.email || '').localeCompare(b.email || '');
                    return 0;
                });
                const list = document.getElementById('partnersList');
                if (!list) { this.renderPartners(); return; }
                const archived = this.partners.filter(p => p.archived_at);
                const renderPartner = (p) => {
                    const driversCount = (this.drivers || []).filter(d => d.partner_id === p.id && !d.archived_at).length;
                    const ordersCount = (this.allBookings || []).filter(b => b.partner_id === p.id).length;
                    return `<div class="partner-card" data-partner-id="${p.id}" style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;">

                            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:4px;">

                                ${p.user_id ? '<span class="status-badge status-completed"><i class="fas fa-key"></i></span>' : '<span class="status-badge status-pending">Geen login</span>'}
                            </div>
                            <div style="color:#64748b; font-size:0.85rem;">${this.escapeHtml(p.contact || '-')} · ${this.escapeHtml(p.email || '-')} · ${this.escapeHtml(p.phone || '-')}</div>
                            <div style="color:#94a3b8; font-size:0.8rem; margin-top:4px;"><strong>${driversCount}</strong> ${driversCount === 1 ? this.escapeHtml(t.metricDriver) : this.escapeHtml(t.metricDrivers)} · <strong>${ordersCount}</strong> ${ordersCount === 1 ? this.escapeHtml(t.metricRide) : this.escapeHtml(t.metricRides)} · ${this.escapeHtml(t.partnerMetricPrefix)}: <code>${this.escapeHtml(p.prefix || '-')}</code></div>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <button class="action-btn" onclick="app.editPartner(${p.id})"><i class="fas fa-edit"></i></button>
                            <button class="action-btn" onclick="app.showPartnerDetails(${p.id})"><i class="fas fa-eye"></i></button>
                            <button class="delete-btn" onclick="app.archivePartner(${p.id})"><i class="fas fa-archive"></i></button>
                            <button class="delete-btn" onclick="app.deletePartner(${p.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                };
                list.innerHTML = filtered.length
                    ? filtered.map(renderPartner).join('')
                    : `<div class="empty-planning">Geen partners gevonden voor deze filter.</div>`;
            },

            async editPartner(partnerId) {
                const p = this.partners.find(x => String(x.id) === String(partnerId));
                if (!p) return;
                const t = translations[currentLang];
                const name = prompt('Bedrijfsnaam:', p.name || '');
                if (name === null) return;
                const contact = prompt('Contactpersoon:', p.contact || '');
                if (contact === null) return;
                const email = prompt('Email:', p.email || '');
                if (email === null) return;
                const phone = prompt('Telefoon:', p.phone || '');
                if (phone === null) return;
                const prefix = prompt('Prefix (2-4 letters):', p.prefix || '');
                if (prefix === null) return;
                const isHoofdStr = prompt('Hoofdpartner? (ja/nee):', p.is_hoofd ? 'ja' : 'nee');
                if (isHoofdStr === null) return;
                const is_hoofd = String(isHoofdStr).toLowerCase().startsWith('j');
                const { error } = await supabase.rpc('update_partner', {
                    p_partner_id: p.id,
                    p_name: name || null,
                    p_email: email || null,
                    p_phone: phone || null,
                    p_prefix: prefix || null,
                    p_is_hoofd: is_hoofd
                });
                if (error) { this.showToast('Bewerken mislukt: ' + error.message, true); return; }
                this.showToast(`${name} bijgewerkt`);
                await this.loadPartners();
                if (this.currentTab === 'partners') this.renderPartners();
            },

            async archivePartner(partnerId) {
                if (!confirm('Partner archiveren?')) return;
                const { error } = await supabase.rpc('update_partner', { p_partner_id: partnerId, p_archived: true });
                if (error) { this.showToast('Archiveren mislukt: ' + error.message, true); return; }
                this.showToast('Partner gearchiveerd');
                await this.loadPartners();
                if (this.currentTab === 'partners') this.renderPartners();
            },

            async unarchivePartner(partnerId) {
                const { error } = await supabase.rpc('update_partner', { p_partner_id: partnerId, p_archived: false });
                if (error) { this.showToast('Heractiveren mislukt: ' + error.message, true); return; }
                this.showToast('Partner heractief');
                await this.loadPartners();
                if (this.currentTab === 'partners') this.renderPartners();
            },

                    <div class="fiche-section"><h4>Chauffeurs (${drivers.length})</h4>

                document.getElementById('ficheBody').innerHTML = html;
                document.getElementById('bookingModal').style.display = 'flex';
            },

                };

                // PRIME r056 Phase E round 1 feedback fix #1: helper for non-customer account requests in merged view
                const renderAccountRequestItem = (r) => {

                        listEl.innerHTML = this.renderMailboxAdapterUnavailable('mailbox_adapter_exception');

            async submitComposeMail(mode) {
                const to = document.getElementById('composeTo')?.value?.trim();

                const subject = document.getElementById('composeSubject')?.value?.trim();
                const body = document.getElementById('composeBody')?.value;

                if (!to) { this.showToast('Aan-veld is verplicht.', true); return; }
                if (!subject) { this.showToast('Onderwerp is verplicht.', true); return; }
                const btn = document.getElementById('composeSendBtn');

                try {
                    let action = 'compose';
                    let payload = { action, to, cc, subject, body };
                    if (mode === 'reply') {
                        action = 'reply';
                        payload = { action, originalSubject: subject, originalFrom: to, body };
                    }
                    if (mode === 'forward') {
                        action = 'forward';
                        payload = { action, to, originalSubject: subject, originalBody: body };

                    payload.action = action;

                    }
                    this.showToast('Mail verstuurd (id: ' + (data.messageId || '-') + ')');

                } catch (e) {

            async sendAccountDecisionEmail(request, approved, reason = '', approvalResult = {}, inviteEmailSent = false) { if (!request?.email) return; const subject = approved ? 'Uw FleetConnect accountaanvraag is goedgekeurd' : 'Uw FleetConnect accountaanvraag is beoordeeld';

                // CUSTOMER portal) with copy "U kunt nu inloggen via het
                // klantportaal." — regardless of account_type. For Partner/Operations
                // and Driver requests, this routed the requester to the wrong portal.
                // We now branch the CTA URL and copy on account_type.
                //
                // FIX Blocker 2 (2026-06-16, second pass): the previous version
                // pointed partners to /Paneel/partner-login.html, but newly-approved
                // partners had no password set, so the login page asked for a
                // password they did not have. We now branch on `inviteEmailSent`:
                //   - true:  the partner has been sent a Supabase Auth password
                //            recovery link, so the CTA points to partner-login.html
                //            with copy "check your email, set your password, then
                //            log in"
                //   - false: fall back to partner-login.html (the partner can use
                //            the "wachtwoord vergeten" link to trigger a new
                //            recovery email)
                const accountType = (request.account_type || 'Other').toLowerCase();
                const isOperator = accountType === 'partner' || accountType === 'operations';
                const isDriver = accountType === 'driver';
                const isClient = accountType === 'client' || accountType === 'other';
                let portalUrl, ctaText, approvalText;
                if (isOperator) {
                    portalUrl = this.getAccountRequestPortalUrl(request);
                    ctaText = 'Partnerportaal openen';
                    approvalText = approvalResult.auth_user_linked
                        ? (inviteEmailSent
                            ? 'Uw partnerprofiel is aangemaakt. We hebben u een aparte e-mail gestuurd met een link om uw wachtwoord in te stellen. Klik op de link in die e-mail, stel uw wachtwoord in, en log daarna in op FleetConnect Partner.'
                            : 'Uw partnerprofiel is aangemaakt. Gebruik indien nodig "wachtwoord vergeten" om een wachtwoord-instellink per e-mail te ontvangen, en log daarna in op FleetConnect Partner.')
                        : 'Uw partnerprofiel is aangemaakt. Activeer of verifieer uw login via de beveiligde FleetConnect registratie/verificatie voordat u inlogt op het partnerportaal.';
                } else if (isDriver) {
                    portalUrl = this.getAccountRequestPortalUrl(request);
                    ctaText = 'Chauffeurportaal openen';
                    approvalText = approvalResult.auth_user_linked
                        ? (inviteEmailSent
                            ? 'Uw chauffeurprofiel is aangemaakt. We hebben u een aparte e-mail gestuurd met een link om uw wachtwoord in te stellen. Klik op de link in die e-mail, stel uw wachtwoord in, en log daarna in op FleetConnect Partner.'
                            : 'Uw chauffeurprofiel is aangemaakt. Gebruik indien nodig "wachtwoord vergeten" om een wachtwoord-instellink per e-mail te ontvangen, en log daarna in op FleetConnect Partner.')
                        : 'Uw chauffeurprofiel is aangemaakt. Activeer of verifieer uw login via de beveiligde FleetConnect registratie/verificatie voordat u inlogt op het chauffeurportaal.';
                } else {
                    // Client or Other — keep the original (correct) customer-portal behavior
                    portalUrl = `${window.location.origin}/PV/index.html?email=${encodeURIComponent(request.email)}`;
                    ctaText = 'Klantportaal openen';
                    approvalText = approvalResult.auth_user_linked
                        ? 'Uw klantprofiel is gekoppeld aan uw FleetConnect login. U kunt nu inloggen via het klantportaal.'
                        : 'Uw klantprofiel is aangemaakt. Activeer of verifieer uw login via de beveiligde FleetConnect registratie/verificatie voordat u inlogt.';
                }
                const html = `<div style="font-family: Inter, Arial, sans-serif; color:#0f172a;"><h2>${subject}</h2><p>Beste ${this.escapeHtml(request.name || 'aanvrager')},</p><p>${approved ? approvalText : 'Uw accountaanvraag werd niet goedgekeurd.'}</p>${approvalResult.customer_id ? `<p><strong>Klantprofiel:</strong> ${this.escapeHtml(approvalResult.customer_id)}</p>` : ''}${reason ? `<p><strong>Reden:</strong> ${this.escapeHtml(reason)}</p>` : ''}${approved ? `<p><a href="${portalUrl}" style="display:inline-block; background:#0f172a; color:#ffffff; padding:12px 18px; border-radius:8px; text-decoration:none; font-weight:700;">${ctaText}</a></p>` : ''}<p>Contacteer support@fleetconnect.be bij vragen.</p></div>`; const result = await comms.activeProvider.send(request.email, subject, html, { trigger: approved ? 'ACCOUNT_REQUEST_APPROVED' : 'ACCOUNT_REQUEST_REJECTED', supabaseUrl: SUPABASE_URL, supabaseKey: SUPABASE_ANON_KEY }); if (!result.success) console.warn('Account decision email failed:', result.error); },
            async approveAccountRequest(requestId) {
                const t = translations[currentLang];
                const request = this.accountRequests.find(r => r.id === requestId);
                if (!confirm(t.accountRequestsApproveConfirm)) return;

                // FIX Blocker 2 (2026-06-16, second pass): use the new

                // link. This is the only way to deliver a token_hash that the
                // partner-set-password.html page can call verifyOtp on, since
                // SQL SECURITY DEFINER cannot call the GoTrue generateLink Go function.
                let inviteEmailSent = false;
                if (data?.requires_invite) {
                    try {
                        const { error: resetError } = await supabase.auth.resetPasswordForEmail(
                            data.email,
                            { redirectTo: `${window.location.origin}/Paneel/partner-set-password.html` }
                        );
                        if (resetError) {
                            console.warn('resetPasswordForEmail failed (partner will need to use the "wachtwoord vergeten" link on the partner login page):', resetError.message);
                        } else {
                            inviteEmailSent = true;
                        }
                    } catch (resetErr) {
                        console.warn('resetPasswordForEmail unavailable:', resetErr.message);
                    }
                }

                await this.sendAccountDecisionEmail(request, true, '', data || {}, inviteEmailSent);
                this.showToast(data?.auth_user_linked ? t.accountRequestsApprovedLinked : t.accountRequestsApprovedAuthRequired);
                await this.refreshAllData(true);
                this.refreshCurrentTab();
            },
            async rejectAccountRequest(requestId) { const t = translations[currentLang]; const request = this.accountRequests.find(r => r.id === requestId); const reason = prompt(t.accountRequestsRejectReason) || ''; const { error } = await supabase.rpc('reject_account_request', { p_request_id: requestId, p_reason: reason }); if (error) { this.showToast(`${t.accountRequestsRejectFailed}: ${error.message}`, true); return; } await this.sendAccountDecisionEmail(request, false, reason); this.showToast(t.accountRequestsRejected); await this.refreshAllData(true); this.refreshCurrentTab(); },
            refreshCurrentTab() { switch(this.currentTab) { case 'neworders': this.renderNewOrders(); break; case 'orders': this.renderOrders(); break; case 'history': this.renderHistory(); break; case 'drivers': this.renderDrivers(); break; case 'customers': this.renderClientsPartners(); break; case 'financieel': this.renderFinance(); break; case 'mailbox': this.renderMailbox(); break; default: this.renderNewOrders(); } },
            switchTab(tabName) { this.currentTab = tabName; document.querySelectorAll('.nav-item').forEach(item => { const itemTab = item.getAttribute('data-tab'); if (itemTab === tabName) item.classList.add('active'); else item.classList.remove('active'); }); this.refreshCurrentTab(); },
            async refreshAllData(silent = false) { let t = translations[currentLang]; if (!silent) this.showToast(t.toastRefreshing); const loaded = await this.loadDashboardData(); if (!loaded) return; this.refreshCurrentTab(); if (!silent) this.showToast(t.toastRefreshed); },
            async logout() { let t = translations[currentLang]; if (confirm(t.confirmLogout)) { sessionStorage.removeItem('horizon_logged_in'); window.location.replace('admin-index.html'); } },
            async init() {
                const savedLang = localStorage.getItem('nh_language');
                if (savedLang && translations[savedLang]) currentLang = savedLang;
                updateUILanguage();
                document.querySelectorAll('.lang-btn').forEach(btn => { if (btn.getAttribute('data-lang') === currentLang) btn.classList.add('active'); btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang'))); });
                const loaded = await this.loadDashboardData();
                if (!loaded) return;
                this.switchTab('neworders');
                document.querySelectorAll('.nav-item[data-tab]').forEach(item => { item.addEventListener('click', (e) => { e.preventDefault(); const tab = item.getAttribute('data-tab'); if (tab) this.switchTab(tab); }); });
                // PRIME r056 Phase D: removed cross-business switch buttons (commander.html, autodealerpaneel.html) per Lux §2
                // PRIME r056 Phase D: removed headerWoningenBtn + headerDealerBtn handlers (cross-business residue)
                document.getElementById('refreshBtn')?.addEventListener('click', () => this.refreshAllData());
                document.getElementById('backBtn')?.addEventListener('click', () => window.location.href = 'admin-index.html');
                document.getElementById('logoutBtn')?.addEventListener('click', () => this.logout());
                document.getElementById('closeModalBtn')?.addEventListener('click', () => this.closeModal());
                document.getElementById('closePartnerModalBtn')?.addEventListener('click', () => this.closePartnerModal());
                document.getElementById('savePartnerBtn')?.addEventListener('click', () => this.savePartner());
                setInterval(() => {
                    const modalOpen = document.getElementById('bookingModal')?.style.display === 'flex';
                    if (!modalOpen) this.refreshAllData(true);
                }, 30000);
            }
        };
        
        app.init().catch(console.error);
        window.app = app;
    </script>
</body>
</html>
